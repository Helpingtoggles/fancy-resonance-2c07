services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hhrn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hhrn}
      POSTGRES_DB: hhrn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hhrn"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      HHRN_DATABASE_URL: postgresql+psycopg2://hhrn:${POSTGRES_PASSWORD:-hhrn}@db:5432/hhrn
      HHRN_SECRET_KEY: ${HHRN_SECRET_KEY:?set HHRN_SECRET_KEY in .env}
      HHRN_ENVIRONMENT: production
      HHRN_STORAGE_DIR: /data/storage
      HHRN_OCR_ENGINE: ${HHRN_OCR_ENGINE:-tesseract}
      HHRN_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  storage:
